/* Marca Dados Arena MRV incorporada ao HTML, sem arquivos externos */
.brand-logo-box{width:100%;padding:3px;background:#111315;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.brand-logo{width:100%;height:auto;aspect-ratio:2.08/1;object-fit:contain;display:block;border-radius:11px}
.brand-insights{display:flex;align-items:center;gap:12px;margin-top:14px;padding:11px 5px;border-top:1px solid #303336;color:#fff}
.brand-insights strong{display:block;font-size:11px;letter-spacing:.42px;white-space:nowrap}
.brand-insights span{display:block;font-size:10px;color:#acb1b5;margin-top:4px}
.rank-avatar{position:relative;overflow:hidden;background:#ededed}
.rank-avatar img{width:100%;height:100%;position:absolute;inset:0;object-fit:cover;object-position:center 25%}
.ranking-item .rank-avatar{width:40px;height:40px;border:1px solid #e6e7e9;border-radius:11px}
.person-cell{display:flex;align-items:center;gap:11px;white-space:nowrap}
.person-cell .rank-avatar{width:38px;height:38px;flex-shrink:0;border-radius:9px}
.person-cell strong{font-size:12px}
.game-crest{display:flex;gap:8px;align-items:center}
.game-crest img{width:28px;height:28px;object-fit:contain;flex-shrink:0}
.demo-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.demo-alert .demo-actions .btn{min-height:32px;padding:6px 10px}
.brand .brand-insights svg{flex-shrink:0}
@media(max-width:720px){.brand-logo-box{min-height:82px}}

  .diagnostic{border:1px solid #e8d6ab}.diag-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;margin-bottom:14px}.diag-grid div{padding:10px;background:#f5f6f7;border-radius:8px;display:flex;flex-direction:column;gap:5px}.diag-grid strong{font-size:10px;color:#7e858a}.diag-grid span{font-size:13px;font-weight:800}.diagnostic p{font-size:12px;color:#53606a;line-height:1.6;overflow-wrap:anywhere}.data-warning{align-items:flex-start}.data-warning p{margin:6px 0 8px}.data-warning strong{display:block}.brand{padding:20px 20px 18px}
  
.connection-settings{border-top:1px solid #e4e8ed;margin-top:19px;padding-top:15px}
.connection-settings h4{font-size:15px;margin:0 0 8px;color:#161a1d}
.connection-settings p,.connection-tip{font-size:13px;line-height:1.65;color:#6c7684}
.connection-settings code,.diagnostic code{font-size:12px;overflow-wrap:anywhere;background:#f2f3f5;border-radius:4px;padding:3px 5px;color:#2e3338}
.connection-form{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin-top:12px}
.connection-form label{font-size:12px;font-weight:700;flex:1 1 270px;color:#505865}
.connection-form input{margin-top:6px;width:100%;display:block;padding:12px;border:1px solid #dce1e6;border-radius:8px;outline:none}
.connection-form .btn{min-height:44px}.btn-import{display:inline-flex;cursor:pointer}
.diagnostic details{font-size:12px;color:#59616b;margin-top:12px}
.diagnostic summary{cursor:pointer;font-weight:700}.diagnostic li{padding:4px 0;overflow-wrap:anywhere}

/* Portal de cadastro administrativo */
.cad-head{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#171819;color:#fff;padding:14px 18px;border-radius:12px;margin-bottom:16px;flex-wrap:wrap}
.cad-head span{font-size:12px;color:#d5bc81}
.cad-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.cad-tab{border:1px solid #dfe3e6;background:#fff;color:#45484b;cursor:pointer;border-radius:10px;font-weight:700;font-size:13px;padding:12px 15px}
.cad-tab.active{background:#161719;color:#fff;border-color:#161719;box-shadow:inset 0 -3px 0 #cead5e}
.cad-form-panel,.cad-list{margin-bottom:22px}
.cad-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 20px;padding:12px 0}
.cad-field{display:flex;flex-direction:column;gap:8px;font-size:13px;color:#20252a;font-weight:700;min-width:0}
.cad-field input,.cad-field select{width:100%;height:48px;box-sizing:border-box;border:1px solid #dce1e4;background:#fff;border-radius:9px;padding:0 13px;font:inherit;font-weight:500;color:#21252a;outline:none}

.game-bordero-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin:16px 0 22px}.game-bordero-summary>div{background:#f5f6f7;border:1px solid #e1e4e7;border-radius:13px;padding:15px 13px;display:flex;flex-direction:column;gap:7px}.game-bordero-summary strong{font-size:19px;color:#202426;overflow-wrap:anywhere}.game-bordero-summary small{color:#7a8591;font-size:12px} .dre-table ~ details{margin-top:16px} .panel details{margin:12px 0;border:1px solid #e4e6ea;border-radius:10px;padding:12px} .panel details>summary{font-weight:700;cursor:pointer;margin:4px 0 12px}.game-import-grid textarea{min-height:200px}.game-alert{overflow-wrap:anywhere}

.game-manual-entry{border:1px solid #d8dce1;border-radius:14px;background:#fafbfc;padding:14px;margin:18px 0}.game-manual-entry .game-subtitle{margin-top:0}.game-manual-row{display:grid;grid-template-columns:minmax(200px,2fr) 110px 130px minmax(170px,1fr);gap:12px;align-items:end;padding:10px 0;border-bottom:1px solid #e7e9ec}.game-manual-buttons{display:flex;gap:5px;flex-wrap:wrap}.game-own-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin:14px 0}.game-own-section{border:1px solid #d8dce1;border-radius:12px;padding:12px;background:#fbfbfc}.game-own-row{display:grid;grid-template-columns:1fr minmax(120px,1fr) minmax(110px,1fr);gap:10px;align-items:end;margin-top:10px}.game-own-row strong{font-size:13px}.game-score-review{display:flex;justify-content:space-between;gap:14px;padding:12px 15px;border:1px solid #d6dce4;border-radius:10px;background:#f5f7fa;margin:12px 0}.game-score-review span{color:#555}@media(max-width:860px){.game-manual-row,.game-own-grid,.game-own-row{display:grid;grid-template-columns:1fr}.game-score-review{flex-direction:column}}

@media(max-width:720px){.metric-value{font-size:clamp(16px,3.5vw,23px)}.comp-val{font-size:clamp(15px,3vw,20px)}}

/* V21: Occupancy and match-by-match Top 10 */
.occ-section-title-v21{margin:28px 0 14px}.occ-section-title-v21 h2{font-size:21px;margin:0 0 5px;color:#171b1e}.occ-section-title-v21 p{margin:0;color:#79838b;font-size:13px;line-height:1.5}
.occ-top-grid-v21{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:16px 0 24px}.occ-top-grid-v21.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.occ-rank-card-v21{padding:18px;background:#fff;border:1px solid #dfe4e8;border-radius:16px;min-width:0}.occ-rank-card-v21 h3{font-size:16px;margin:0 0 15px}.occ-rank-line-v21{display:flex;gap:10px;align-items:center;border-top:1px solid #eff1f2;padding:9px 0}.occ-rank-number-v21{width:23px;color:#a38b55;font-weight:750;font-size:12px;flex:none}.occ-rank-item-v21{border:0;background:transparent;padding:0;text-align:left;color:#202428;display:flex;align-items:center;gap:9px;justify-content:space-between;width:100%;cursor:pointer;min-width:0}.occ-rank-item-v21:hover .occ-rank-team-v21 b{text-decoration:underline}.occ-rank-team-v21{display:flex;flex-direction:column;min-width:0;flex:1;gap:3px}.occ-rank-team-v21 b{font-size:13px;line-height:1.35}.occ-rank-team-v21 small{font-size:11px;color:#88919b}.occ-rank-item-v21>strong{white-space:nowrap;font-size:14px;color:#1d2225}.occ-rank-item-v21>.rank-avatar{height:34px;width:34px;flex:none}
.occ-rank-toolbar-v21{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:14px 0}.occ-rank-toolbar-v21 label{font-size:12px;color:#616a72;display:flex;flex-direction:column;gap:5px}.occ-rank-toolbar-v21 select{padding:10px 12px;background:#fff;border:1px solid #d9dfe3;border-radius:9px;min-width:270px;max-width:100%;font-size:13px}.occ-rank-toolbar-v21 small{font-size:12px;color:#78818a}
.occ-season-grid-v21{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}.occ-season-card-v21{border:1px solid #e3e5e7;background:#f8f9fa;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:7px;min-width:140px}.occ-season-card-v21 b{font-size:12px}.occ-season-card-v21 strong{font-size:23px}.occ-season-card-v21 small{font-size:11px;color:#848c93}

.occ-section-v21{margin:16px 0;padding:20px;border:1px solid #e0e5e9;border-radius:16px;background:#fbfcfc}.occ-section-v21 h3{margin:0 0 15px;font-size:17px}.occ-kpis-v21{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.occ-kpis-v21>div{display:flex;flex-direction:column;gap:4px;background:#fff;border:1px solid #e7eaed;border-radius:10px;padding:13px}.occ-kpis-v21 small{color:#848e98;font-size:11px}.occ-kpis-v21 strong{font-size:24px}.occ-kpis-v21 span{color:#6c7680;font-size:12px}.occ-sector-grid-v21{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px;margin-top:20px}.occ-sector-v21{min-width:0}.occ-sector-head-v21{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;margin-bottom:7px}.occ-sector-head-v21 b{font-size:12px}.occ-sector-head-v21 span{color:#697783;text-align:right}.occ-track-v21{height:9px;background:#e9edf0;border-radius:12px;overflow:hidden}.occ-track-v21 i{display:block;height:100%;background:#bfa168;border-radius:12px}.occ-explain-v21{font-size:12px;color:#76818b;line-height:1.65;margin:15px 0 0}

.quick-image-drop:focus-visible{outline:3px solid #d4b571;outline-offset:2px;}
.quick-image-drop img{max-width:100%;max-height:72px;object-fit:contain;}

.rival-goal-needs{color:#a53232;font-size:12px;font-weight:700}

function finance(m){
 const complete=m.map(x=>{
  const b=x.bordero;
  if(b){
   const revenue=n(b.receita_bruta)??x.revenue;
   const expense=n(b.despesa_total);
   return {revenue,expense,b1:n(b.grupos?.B1),b2:n(b.grupos?.B2),b3:n(b.grupos?.B3),discounts:n(b.descontos_total),net:n(b.liquido_galo),has:revenue!=null&&expense!=null};
  }
  const v=x.expenses,expense=v&&Object.values(v).every(y=>y!==null)?Object.values(v).reduce((a,y)=>a+y,0):null;
  return {revenue:x.revenue,expense,b1:v?.other??null,b2:v?.taxes??null,b3:v?.operations??null,discounts:null,net:null,has:x.revenue!=null&&expense!=null};
 });
 const coverage=complete.filter(x=>x.has).length,total=m.length;
 const revenue=m.some(x=>x.revenue!=null||x.bordero?.receita_bruta!=null)?sum(complete,x=>x.revenue):null;
 const expenses=coverage===total&&total?sum(complete,x=>x.expense):null;
 const profit=revenue!=null&&expenses!=null?Math.round((revenue-expenses)*100)/100:null;
 const metric=(name)=>complete.every(x=>x[name]!=null)&&total?sum(complete,x=>x[name]):null;
 return {revenue,expenses,profit,avgProfit:profit!=null?profit/total:null,avgExpenses:expenses!=null?expenses/total:null,b1:metric('b1'),b2:metric('b2'),b3:metric('b3'),discounts:complete.some(x=>x.discounts!=null)?sum(complete,x=>x.discounts):null,net:complete.some(x=>x.net!=null)?sum(complete,x=>x.net):null,coverage,total};
}
// Estatísticas de ingressos: preços ofertados (ponderados pela oferta) e valor
// efetivamente arrecadado por ingresso vendido (incluindo gratuidades).
function calcTicketPriceMetrics(tickets, gross, sold){
 const rows=Array.isArray(tickets)?tickets:[];
 const priced=rows.map(r=>({preco:n(r.preco),disponiveis:n(r.disponiveis)??n(r.vendidos)}))
   .filter(r=>r.preco!=null&&r.preco>0&&r.disponiveis!=null&&r.disponiveis>0);
 const offered=priced.reduce((acc,r)=>acc+r.disponiveis,0);
 const sumPriceCents=priced.reduce((acc,r)=>acc+Math.round(r.preco*100)*r.disponiveis,0);
 const validSold=n(sold),validGross=n(gross);
 return {
  minimo:priced.length?Math.min(...priced.map(r=>r.preco)):null,
  maximo:priced.length?Math.max(...priced.map(r=>r.preco)):null,
  medioBilheteria:offered?sumPriceCents/(100*offered):null,
  ticketMedio:validSold>0&&validGross!=null?Math.round(validGross*100)/(100*validSold):null,
  categorias:priced.length,
  ofertadosPagos:offered
 };
}
function ticketMetricsFromMatches(games){
 const withTickets=(games||[]).filter(g=>Array.isArray(g.bordero?.ingressos)&&g.bordero.ingressos.length);
 const rows=withTickets.flatMap(g=>g.bordero.ingressos);
 let grossCents=0,sold=0,complete=0;
 for(const game of withTickets){
  const bord=game.bordero;
  const income=n(bord.receita_bruta)??sum(bord.ingressos,x=>x.arrecadacao);
  const volume=n(bord.vendidos)??sum(bord.ingressos,x=>x.vendidos);
  if(income!=null&&volume!=null){grossCents+=Math.round(income*100);sold+=volume;complete++;}
 }
 return {...calcTicketPriceMetrics(rows,complete?grossCents/100:null,complete?sold:null),jogos:withTickets.length,totalJogos:games.length};
}

 else if(ch===delimiter&&!quoted){current.push(cell);cell='';}

 if(!r.ok){const payload=await r.json().catch(()=>({}));const error=new Error(`${payload.message||payload.details||payload.hint||'Falha na consulta'} (HTTP ${r.status})`);error.status=r.status;throw error;}

const CAD_COLUMNS={
 jogadores:'id,pessoa_id,temporada,nome_completo,nome_guerra,posicao,nacionalidade,data_nascimento,numero,pe_preferencial,criado_em,atualizado_em',

};
let cadLoadingPromise=null;
const cadTableStatus={};
async function loadCadRecords({silent=false}={}){
 if(!state.adminToken)return;
 if(cadLoadingPromise)return cadLoadingPromise;
 const tables=['jogadores','arbitragem','adversarios','campeonatos','jogos','atuacoes','vinculos_nomes_jogadores','vinculos_nomes_clubes'];
 tables.forEach(t=>{if(!cadRecords[t]?.length)cadTableStatus[t]='loading'});
 cadLoadingPromise=(async()=>{
  const responses=await Promise.allSettled(tables.map(t=>adminRows(t,CAD_COLUMNS[t],20000)));
  const errors=[];
  tables.forEach((table,index)=>{
   const response=responses[index];
   if(response.status==='fulfilled'){
    // As imagens não trafegam na lista. Preserve fotos que já foram abertas na edição.
    const loaded=response.value;
    if(['jogadores','arbitragem','adversarios'].includes(table)){
     const previous=new Map((cadRecords[table]||[]).filter(x=>x.foto||x.escudo).map(x=>[x.id,x]));
     loaded.forEach(x=>{const saved=previous.get(x.id);if(saved){if(saved.foto)x.foto=saved.foto;if(saved.escudo)x.escudo=saved.escudo;}});
    }
    cadRecords[table]=loaded;cadTableStatus[table]='ready';
   }else{cadTableStatus[table]='error';errors.push(`${table}: ${response.reason?.message||'erro de consulta'}`);}
  });
  cadastroLoaded=cadTableStatus.jogos==='ready';
  cadMessage=errors.length?'Erro ao carregar: '+errors.join(' | '):'';
  if(!silent&&(state.page==='cadastro'||state.page==='inserir-jogos'))render();
 })().finally(()=>{cadLoadingPromise=null});
 return cadLoadingPromise;
}

// Busca pelo nome normalizado, com verificação ao consultar E imediatamente antes de gravar.
// O banco possui também índices únicos para impedir corridas entre duas abas/navegadores.
function chaveNomeJS(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ');}
// Formata nomes de árbitros, assistentes e VAR quando chegam inteiramente em caixa alta.
// Nomes já escritos em caixa mista são preservados; códigos/IDs não são alterados.
function normalizarNomeArbitragem(value){
 const original=String(value??'').trim().replace(/\s+/g,' ');
 if(!original || !/\p{L}/u.test(original) || original!==original.toLocaleUpperCase('pt-BR'))return original;
 const minusculas=new Set(['de','da','do','das','dos','e']);
 return original.toLocaleLowerCase('pt-BR').split(/(\s+)/).map((parte,i)=>{
  if(!parte || /^\s+$/.test(parte))return parte;
  return parte.split(/([-’'])/).map((p,j)=>{
   if(!p || /^[-’']$/.test(p))return p;
   if(minusculas.has(p) && i>0)return p;
   return p.replace(/^\p{L}/u, letra=>letra.toLocaleUpperCase('pt-BR'));
  }).join('');
 }).join('');
}

 return false;

async function buscarCadastroPorNome(nome,tabela=cadastroTipo(),tipo=cadastroRotaTipo(),temporada=null){
 const chave=chaveNomeJS(nome);if(chave.length<2)return null;
 const match=x=>chaveNomeJS(tabela==='jogadores'?x.nome_completo:x.nome)===chave&&(tabela!=='arbitragem'||x.tipo===tipo);
 const locais=(cadRecords[tabela]||[]).filter(match);
 if(locais.length){return temporada&&tabela==='jogadores'?(locais.find(x=>String(x.temporada)===String(temporada))||locais[0]):locais[0];}
 const tipoFiltro=tabela==='arbitragem'?'&tipo=eq.'+encodeURIComponent(tipo):'';
 const resultado=await tableRequest(tabela,{query:'select=*&nome_normalizado=eq.'+encodeURIComponent(chave)+tipoFiltro+'&limit=100',authenticated:true});
 if(tabela==='jogadores'&&temporada){return resultado.find(x=>String(x.temporada)===String(temporada))||resultado[0]||null;}
 return resultado[0]||null;
}

 return tabela==='jogadores'

  :`“${nome}” já está cadastrado. Registro recuperado com o ID ${item.id}; utilize Salvar alterações.`;
}
function agendarBuscaCadastro(input){
 const tabInicial=cadTab,nome=input.value.trim(),numero=++cadLookupSeq;
 if(!['jogadores','arbitragem'].includes(cadastroTipo()))return;
 if(cadLookupTimer)clearTimeout(cadLookupTimer);
 const aviso=document.getElementById('cadLookupStatus');if(!aviso)return;
 aviso.className='cad-lookup-status';
 if(nome.length<3){aviso.textContent='Digite o nome para verificar se já existe no banco.';return;}
 const temporada=formSeasonFromCadastro();
 if(cadastroTipo()==='jogadores')cadSeason=temporada; // guarda a temporada escrita antes de recuperar outro ano
 aviso.textContent='Consultando o nome no Supabase...';
 cadLookupTimer=setTimeout(async()=>{
  try{
   const tabela=cadastroTipo(),encontrado=await buscarCadastroPorNome(nome,tabela,cadastroRotaTipo(),temporada);
   if(numero!==cadLookupSeq||tabInicial!==cadTab||!document.getElementById('cadForm'))return;
   const status=document.getElementById('cadLookupStatus');if(!status)return;
   if(!encontrado){cadTemplate=null;status.textContent='Nome não cadastrado nesta temporada. Você pode criar um novo registro.';return;}
   if(!pessoaRotaValida(encontrado)){
    status.className='cad-lookup-status warning';
    status.textContent=`O nome existe na aba ${encontrado.posicao==='Técnico'?'Técnicos':'Jogadores'}. Verifique o cadastro antes de continuar.`;return;
   }
   const outraTemporada=tabela==='jogadores'&&String(encontrado.temporada)!==String(temporada);
   // Recupera os dados da temporada anterior, mas NÃO edita o cadastro anterior nem muda a temporada do formulário.
   if(outraTemporada){
    cadEdit=null;cadTemplate={...encontrado,temporada};
    cadMessage=`Dados recuperados de ${encontrado.temporada}. A temporada ${temporada} foi mantida. Será criado um novo ID nesta temporada.`;
   }else{
    cadTemplate=null;cadEdit=encontrado.id;
    cadMessage=mensagemDuplicado(encontrado,tabela);
   }
   if(!(cadRecords[tabela]||[]).some(r=>r.id===encontrado.id))cadRecords[tabela].push(encontrado);
   ++cadLookupSeq;render();
  }catch(e){
   if(numero!==cadLookupSeq)return;
   const status=document.getElementById('cadLookupStatus');if(status){status.className='cad-lookup-status warning';status.textContent='Consulta falhou. O banco verificará duplicidade antes de salvar.';}
  }
 },450);
}

async function saveCadastro(form){

 if(!form.checkValidity()){form.reportValidity();return;}
 cadBusy=true;
 ++cadLookupSeq;if(cadLookupTimer)clearTimeout(cadLookupTimer);
 const table=cadastroTipo();
 const button=form.querySelector('button[type="submit"]');
 if(button){button.disabled=true;button.textContent='Salvando...';button.setAttribute('aria-busy','true');}
 let atualizado=false;
 try{
  const row=readRecordFromForm(form),id=cadEdit;
  // Se a imagem não foi alterada na edição, manter a foto já salva no Supabase.
  if(id){for(const property of ['foto','escudo'])if(row[property]==null)delete row[property];}
  if(table==='campeonatos'){
   const duplicado=(cadRecords.campeonatos||[]).find(x=>chaveNomeJS(x.nome)===chaveNomeJS(row.nome)&&x.id!==id);
   if(duplicado)throw new Error('O campeonato já está cadastrado. Edite o registro existente.');
  }
  if(table==='jogadores'||table==='arbitragem'){
   const existente=await buscarCadastroPorNome(table==='jogadores'?row.nome_completo:row.nome,table,table==='arbitragem'?row.tipo:null,table==='jogadores'?row.temporada:null);
   if(existente&&existente.id!==id&&(table!=='jogadores'||String(existente.temporada)===String(row.temporada))){
    if(!(cadRecords[table]||[]).some(r=>r.id===existente.id))cadRecords[table].push(existente);
    if(pessoaRotaValida(existente))cadEdit=existente.id;
    throw new Error(pessoaRotaValida(existente)?mensagemDuplicado(existente,table):'Este nome já existe na aba '+(existente.posicao==='Técnico'?'Técnicos':'Jogadores')+'. Edite o registro original.');
   }
  }
  const query=id?'id=eq.'+encodeURIComponent(id):'';
  await tableRequest(table,{method:id?'PATCH':'POST',query,body:row,authenticated:true});
  cadEdit=null;cadPhoto='';cadTemplate=null;
  await loadCadRecords({silent:true});
  cadMessage=id?'Registro atualizado. ID original preservado.':'Registro criado com ID único. Pronto para o próximo cadastro.';
  atualizado=true;
 }catch(e){
  cadMessage=e?.message||'Não foi possível salvar o cadastro.';
 }finally{
  cadBusy=false; // IMPORTANTE: liberar antes de redesenhar a página
  state.page='cadastro';
  render();
 }
 if(atualizado){try{await loadLive();state.page='cadastro';render();}catch(e){console.warn('Atualização de indicadores:',e);}}
}

let publicDetailedPlayerStats=[];
async function hydrateReference(list){
 try{
  const tables=['jogadores','adversarios','atuacoes','jogo_estatisticas_coletivas','jogo_estatisticas_individuais'];
  const results=await Promise.all(tables.map(t=>readAllRows(t,'',30000)));
  const [players,opps,appearances,collectiveStats,individualStats]=results;athleteParticipationRows=appearances;
  const pById=new Map(players.map(x=>[x.id,x]));
  athletePersonById=new Map(players.map(p=>[String(p.id),String(p.pessoa_id||p.id)]));
  const oById=new Map(opps.map(x=>[x.id,x]));
  const mById=new Map(list.map(x=>[String(x.id),x]));
  list.forEach(x=>x.extraTeamStats={});
  for(const row of collectiveStats){const game=mById.get(String(row.jogo_id));if(game)game.extraTeamStats[row.equipe]=row;}
  publicDetailedPlayerStats=individualStats.map(row=>({...row,ativo:!!row.participou||row.rating!==null||Number(row.toques_bola)>0,
    posicao:pById.get(row.jogador_id)?.posicao||'',pessoa_id:pById.get(row.jogador_id)?.pessoa_id||row.jogador_id,nome_guerra:pById.get(row.jogador_id)?.nome_guerra||'',nome_completo:pById.get(row.jogador_id)?.nome_completo||'',foto:pById.get(row.jogador_id)?.foto||''}));
  photoById=new Map();photoByName=new Map();crestById=new Map();crestByName=new Map();
  players.forEach(p=>{const url=safeAsset(p.foto);if(url){photoById.set(String(p.id),url);photoByName.set(norm(p.nome_guerra),url);}});
  opps.forEach(o=>{const url=safeAsset(o.escudo);if(url){crestById.set(String(o.id),url);crestByName.set(norm(o.nome),url);}});
  const matchesById=new Map(list.map(x=>[String(x.id),x]));
  list.forEach(m=>{
   m.goals=[];m.assists=[];m.yellowCards=[];m.redCards=[];
   const p=pById.get(m.coachId);if(p){m.coach=p.nome_guerra;m.coachPessoaId=p.pessoa_id||p.id;}
   const o=oById.get(m.opponentId);if(o)m.opponent=o.nome;
  });
  // O JSON individual já salvo é a fonte principal de assistências (goalAssist).
  // Não se soma o mesmo jogador duas vezes, mesmo quando ele também possui uma linha em atuacoes.
  // Caso o JSON NÃO tenha o campo, mantém o valor da atuação como alternativa.
  const sourceByAppearance=new Map();
  for(const s of individualStats){
   const key=`${s.jogo_id}:${s.jogador_id}`;
   const raw=s.json_bruto?.statistics?.goalAssist;
   const count=metricValue(raw??s.assistencias);
   if(!sourceByAppearance.has(key)||raw!=null)sourceByAppearance.set(key,count);
  }
  for(const a of appearances){const m=matchesById.get(String(a.jogo_id)),p=pById.get(a.jogador_id);if(!m||!p)continue;
   const base={id:p.pessoa_id||p.id,name:p.nome_guerra,position:p.posicao,photo:p.foto};
   if(a.gols>0)m.goals.push({...base,count:a.gols});
   if(a.amarelos>0)m.yellowCards.push({...base,count:a.amarelos});
   if(a.vermelhos>0)m.redCards.push({...base,count:a.vermelhos});
  }
  const seenAssistantRows=new Set();
  for(const s of individualStats){
   const key=`${s.jogo_id}:${s.jogador_id}`;
   if(seenAssistantRows.has(key))continue;
   seenAssistantRows.add(key);
   const m=matchesById.get(String(s.jogo_id)),p=pById.get(s.jogador_id);
   const assists=sourceByAppearance.get(key);
   if(m&&p&&assists>0)m.assists.push({id:p.pessoa_id||p.id,name:p.nome_guerra,position:p.posicao,photo:p.foto,count:assists});
  }
  for(const a of appearances){
   const key=`${a.jogo_id}:${a.jogador_id}`;
   if(sourceByAppearance.get(key)!=null)continue;
   const m=matchesById.get(String(a.jogo_id)),p=pById.get(a.jogador_id);
   const assists=n(a.assistencias)??0;
   if(m&&p&&assists>0)m.assists.push({id:p.pessoa_id||p.id,name:p.nome_guerra,position:p.posicao,photo:p.foto,count:assists});
  }
 }catch(e){assetIssue='Não foi possível carregar elenco e súmulas: '+e.message;console.warn(assetIssue);}
}

function fixedCoachForSeason(temporada){
 if(!gameCoachFixed||!gameCoachId)return '';
 const all=cadRecords.jogadores||[];
 const original=all.find(x=>x.id===gameCoachId&&x.posicao==='Técnico');
 if(!original)return '';
 if(String(original.temporada)===String(temporada))return original.id;
 if(original.pessoa_id){const same=all.find(x=>x.posicao==='Técnico'&&String(x.temporada)===String(temporada)&&x.pessoa_id===original.pessoa_id);if(same)return same.id;}
 const candidates=all.filter(x=>x.posicao==='Técnico'&&String(x.temporada)===String(temporada)&&jnorm(x.nome_completo)===jnorm(original.nome_completo));
 return candidates.length===1?candidates[0].id:'';
}

function gameTodayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function dateInGameSeason(date,season){
 const year=String(season||'');if(!/^\d{4}$/.test(year))return date||'';
 const source=/^\d{4}-(\d{2})-(\d{2})$/.exec(String(date||''));if(!source)return '';
 const month=Number(source[1]),day=Number(source[2]);if(month<1||month>12||day<1)return '';
 const maxDay=new Date(Number(year),month,0).getDate();

   // Retira esse trecho somente se ele começar pelo adversario conhecido

    }
   }
  }
 }

function applyEventEditor(){
 const row=document.querySelector('tr.game-event-editor');if(!row)return false;
 const key=gameEventEditorKey;
 const fields=Object.fromEntries([...row.querySelectorAll('[data-editor-field]')].map(el=>[el.dataset.editorField,el.value]));
 if(!['Galo','Adversario'].includes(fields.equipe)){window.alert('Selecione uma equipe válida.');return false;}
 if(key.startsWith('own:')){
  const match=/^own:(Galo|Adversario):(\d+)$/.exec(key);if(!match)return false;
  const side=match[1],index=Number(match[2]),list=gameDraft.detalhesContra?.[side]||[];
  if(!list[index])return false;
  const minute=String(fields.minuto||'');
  if(!/^\d{1,3}$/.test(minute)||Number(minute)<1||Number(minute)>170||!['1T','2T'].includes(fields.periodo)){
   window.alert('Informe um minuto entre 1 e 170 e um tempo válido.');return false;
  }
  const updated={minuto:minute,periodo:fields.periodo};
  if(side===fields.equipe){list[index]=updated;}
  else{
   list.splice(index,1);
   gameDraft.detalhesContra[fields.equipe]??=[];
   gameDraft.detalhesContra[fields.equipe].push(updated);
  }
  gameDraft.gols_contra_galo=String(gameDraft.detalhesContra.Galo.length);
  gameDraft.gols_contra_adversario=String(gameDraft.detalhesContra.Adversario.length);
 }else{

  gameDraft.edicoesEventos??={};gameDraft.edicoesEventos[key]={
   equipe:fields.equipe,nome_original:fields.nome_original.trim(),
   ...(Object.prototype.hasOwnProperty.call(fields,'motivo')?{motivo:fields.motivo}:{})
  };
 }
 gameEventEditorKey='';render();return true;
}

function parseStatJSON(text,label){
 const raw=String(text||'').trim();if(!raw)return {data:null,error:''};
 try{
  const clean=raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();
  return {data:JSON.parse(clean),error:''};
 }catch(e){return {data:null,error:`${label}: JSON inválido (${e.message}).`};}
}
function metricValue(value){
 if(value===null||value===undefined||value==='')return null;
 if(typeof value==='number')return Number.isFinite(value)?value:null;
 const num=Number(String(value).trim().replace('%','').replace(',','.'));
 return Number.isFinite(num)?num:null;
}
function getCollectiveStats(){
 const parsed=parseStatJSON(gameDraft.estatisticas_coletivas_json,'Estatísticas Coletivas');
 if(!parsed.data)return {rows:[],error:parsed.error,provided:false};
 const periods=parsed.data.statistics;
 if(!Array.isArray(periods))return {rows:[],error:'Estatísticas Coletivas: não encontrei a lista statistics.',provided:true};
 const full=periods.find(x=>String(x.period||'').toUpperCase()==='ALL');
 if(!full)return {rows:[],error:'Estatísticas Coletivas: não encontrei period="ALL" (jogo inteiro).',provided:true};
 const map=new Map();
 for(const g of full.groups||[]){for(const it of g.statisticsItems||[]){
  if(!it.key)continue;
  if(!map.has(it.key))map.set(it.key,it);
 }}
 const rows=['Galo','Adversario'].map(side=>{
  const obj={equipe:side,json_bruto:parsed.data};
  for(const [target,label,key] of STATS_FIELDS){
   const item=map.get(key),val=side==='Galo'?(item?.homeValue??item?.home):(item?.awayValue??item?.away);
   obj[target]=metricValue(val);
  }
  return obj;
 });
 return {rows,error:'',provided:true};
}
function sourcePlayerId(entry,index){return String(entry?.player?.id??entry?.player?.sofascoreId??`row_${index}`);}
function matchingStatisticPlayer(entry,index){
 const sourceId=sourcePlayerId(entry,index);
 const supplied=gameDraft.individualLinks?.[sourceId];
 if(supplied){const linked=jplayer(supplied);if(linked)return linked;}
 // IDs estáveis do Sofascore também são vinculados definitivamente à pessoa.
 const saved=(cadRecords.vinculos_nomes_jogadores||[]).find(a=>a.tipo==='Galo'&&a.nome_normalizado===jnorm('sofascore:'+sourceId));
 if(saved){const matches=jplayers().filter(p=>String(p.pessoa_id||p.id)===String(saved.pessoa_id));if(matches.length===1)return matches[0];}
 const name=jnorm(entry?.player?.name),short=jnorm(entry?.player?.shortName),shirt=String(entry?.player?.jerseyNumber||entry?.shirtNumber||'').trim();
 const list=jplayers();
 let found=list.filter(p=>[jnorm(p.nome_guerra),jnorm(p.nome_completo)].some(n=>n===name||n===short));
 if(found.length===1)return found[0];
 found=list.filter(p=>name&&([jnorm(p.nome_completo),jnorm(p.nome_guerra)].some(n=>n.startsWith(name+' ')||name.startsWith(n+' '))));
 if(found.length===1)return found[0];
 const sourceWords=name.split(' ').filter(x=>x.length>2&&!['dos','das','para'].includes(x));
 if(sourceWords.length>=2){found=list.filter(p=>sourceWords.every(w=>jnorm(p.nome_completo).split(' ').includes(w)||jnorm(p.nome_guerra).split(' ').includes(w)));
  if(found.length===1)return found[0];}
 // A camisa é única DENTRO DA PARTIDA: priorizar a escalação confirmada,
 // não o número cadastrado para a temporada (pode mudar durante o ano).
 if(shirt){
  const uniform=v=>String(v??'').replace(/\D/g,'').replace(/^0+/,'')||'0';
  const lineup=assembleGame().escalacao||[];
  const foundInGame=lineup.filter(r=>uniform(r.numero)===uniform(shirt)&&r.jogador_id)
    .map(r=>list.find(p=>p.id===r.jogador_id)).filter(Boolean);
  const unique=[...new Map(foundInGame.map(p=>[p.id,p])).values()];
  if(unique.length===1)return unique[0];
  // Sem escalação identificada, só usar o cadastro da temporada se o número
  // corresponder a exatamente uma pessoa. Em ambiguidade, exigir seleção manual.
  if(!lineup.length){
   const registered=list.filter(p=>p.numero!==null&&p.numero!==undefined&&uniform(p.numero)===uniform(shirt));
   if(registered.length===1)return registered[0];
  }
 }
 return null;
}
function getIndividualStats(){

 if(!Array.isArray(parsed.data?.home?.players))return {rows:[],error:'Estatísticas Individuais: não encontrei home.players. Esperado o JSON do Atlético como mandante.',provided:true};
 const lineup=assembleGame().escalacao;
 const rows=parsed.data.home.players.map((entry,i)=>{
  const sp=entry?.statistics||{},p=matchingStatisticPlayer(entry,i),id=sourcePlayerId(entry,i);
  const x={sourceId:id,jogador_id:p?.id||null,nome:entry?.player?.name||'Jogador sem nome',numero_camisa:String(entry?.player?.jerseyNumber??entry?.shirtNumber??''),sofascore_id:String(entry?.player?.id??''),json_bruto:entry};
  for(const [key,label,team,ind] of STATS_FIELDS)x[key]=ind?metricValue(sp[ind]):null;
  x.assistencias=metricValue(sp.goalAssist);x.assistencias_esperadas=metricValue(sp.expectedAssists);
  x.toques_bola=metricValue(sp.touches);x.rating=metricValue(sp.rating);
  const appearance=lineup.find(e=>e.jogador_id===p?.id);
  x.titular=appearance?!!appearance.titular:!entry.substitute;
  x.participou=appearance?!!appearance.participou:(Number(sp.minutesPlayed||0)>0 || x.rating!==null);

  x.posicao=p?.posicao||'';
  x.ativo=!!x.participou||x.rating!==null||Number(x.toques_bola)>0||Number(x.tempo_jogado)>0;
  return x;
 });
 return {rows,error:'',provided:true};
}

}

// Capacidade de futebol: os 4.266 lugares visitantes são um subconjunto do estádio,
// e NÃO são somados aos três anéis (14.765 + 4.053 + 26.074 = 44.892).
const ARENA_CAP_V21=Object.freeze({total:44892,Brahma:14765,ArcelorMittal:4053,Inter:26074,Visitante:4266});
const ARENA_SECTOR_LABELS_V21={Brahma:'Inferior · Brahma',ArcelorMittal:'Intermediário · ArcelorMittal',Inter:'Superior · Inter',Visitante:'Visitantes (subconjunto)'};
function arenaTicketSectorV21(label){
 const v=norm(label||'');
 if(!v)return {sector:null,visitor:false,reason:'sem localização'};
 // Categorias de cortesias e serviços não possuem setor identificável.
 if(/convenios|autoridades|servicos|gratuidade/.test(v))return {sector:null,visitor:false,reason:'sem setor específico'};
 const visitor=/\bvisitante(?:s)?\b/.test(v);
 const brahma=/\bbrahma\b/.test(v),inter=/\binter\b/.test(v),arcelor=/arcelor|arcelormittal/.test(v);
 const premium=/camarote|lounge/.test(v);
 // Uma única linha pode abranger anéis distintos: NÃO distribuímos ingresso por estimativa.
 const sectors=[brahma,inter,arcelor||premium].filter(Boolean).length;
 if(sectors>1)return {sector:null,visitor,reason:'mistura de anéis'};
 return {sector:brahma?'Brahma':inter?'Inter':(arcelor||premium)?'ArcelorMittal':null,visitor,reason:sectors===0?'sem identificação do anel':''};
}
function arenaOccupationV21(attendance,tickets,declaredSold){
 const valid=Array.isArray(tickets)?tickets:[];
 const sectorSold={Brahma:0,ArcelorMittal:0,Inter:0,Visitante:0};
 let counted=0,allocated=0,visitorLocated=0,invalidRows=0;
 const sectorSeen={Brahma:0,ArcelorMittal:0,Inter:0,Visitante:0};
 for(const line of valid){
  const qty=n(line.vendidos);
  if(qty===null||qty<0){invalidRows++;continue;}
  const classification=arenaTicketSectorV21(line.localizacao);
  counted+=qty;
  if(classification.sector){sectorSold[classification.sector]+=qty;sectorSeen[classification.sector]++;allocated+=qty;}
  if(classification.visitor){sectorSold.Visitante+=qty;sectorSeen.Visitante++;visitorLocated+=qty;}
 }
 // Público informado tem prioridade sobre o borderô. Se ausente, usar total oficial de ingressos.
 const stated=n(attendance),published=n(declaredSold);
 const actual=stated!==null?stated:published!==null?published:(valid.length?counted:null);
 const general=actual===null?null:100*actual/ARENA_CAP_V21.total;
 const unclassified=valid.length?Math.max(0,counted-allocated):null;
 return {actual,general,ticketRows:valid.length,ticketTotal:valid.length?counted:null,
  sectorSold,sectorRates:Object.fromEntries(Object.keys(sectorSold).map(key=>[key,sectorSeen[key]>0?100*sectorSold[key]/ARENA_CAP_V21[key]:null])),
  allocated,unclassified,visitorLocated,invalidRows,
  coverage:counted>0?100*allocated/counted:null,
  difference:actual!==null&&valid.length?actual-counted:null};
}
function arenaOccGameV21(game){return arenaOccupationV21(game.attendance,game.bordero?.ingressos,game.bordero?.ingressos?.length?game.bordero.vendidos:null);}
function arenaSectorPanelV21(attendance,tickets,sold,label='Ocupação por setor'){

async function persistPlayerAlias(tipo,nome,record){
 const normalized=jnorm(nome);
 if(normalized.length<2)return;
 const existing=(cadRecords.vinculos_nomes_jogadores||[]).find(v=>v.tipo===tipo&&v.nome_normalizado===normalized&&(tipo==='Galo'||v.adversario_id===record.adversario_id));
 const body=tipo==='Galo'
  ?{tipo:'Galo',nome_importado:String(nome).trim(),pessoa_id:record.pessoa_id||record.id,adversario_id:null,adversario_jogador_id:null}
  :{tipo:'Adversario',nome_importado:String(nome).trim(),pessoa_id:null,adversario_id:record.adversario_id,adversario_jogador_id:record.id};
 if(existing){
  const same=tipo==='Galo'?String(existing.pessoa_id)===String(body.pessoa_id):String(existing.adversario_jogador_id)===String(body.adversario_jogador_id);
  if(same)return existing;
  if(!window.confirm('Este nome já está vinculado a outro jogador. Deseja corrigir o vínculo permanente?'))throw new Error('Vínculo anterior mantido.');
  const rows=await tableRequest('vinculos_nomes_jogadores',{method:'PATCH',query:'id=eq.'+encodeURIComponent(existing.id),body,authenticated:true});
  Object.assign(existing,rows[0]||body);return existing;
 }
 let row;
 try{const rows=await tableRequest('vinculos_nomes_jogadores',{method:'POST',body,authenticated:true});row=rows[0];}
 catch(error){
  if(!/23505|duplicate|duplicad|unique/i.test(error.message))throw error;
  const latest=await tableRequest('vinculos_nomes_jogadores',{query:'select=*&nome_normalizado=eq.'+encodeURIComponent(normalized),authenticated:true});
  const match=latest.find(v=>v.tipo===tipo&&(tipo==='Galo'||v.adversario_id===record.adversario_id));
  if(match){cadRecords.vinculos_nomes_jogadores.push(match);return persistPlayerAlias(tipo,nome,record);}
  throw error;
 }
 if(!row?.id)throw new Error('O banco não confirmou a gravação do vínculo.');
 cadRecords.vinculos_nomes_jogadores??=[];cadRecords.vinculos_nomes_jogadores.push(row);return row;
}

// Importação de borderôs brasileiros. Valores internos em reais, nunca floats de moeda para conferência centesimal.
function moneyBR(value){const x=String(value||'').trim().replace(/R\$\s*/g,'').replace(/[−–—]/g,'-').replace(/\s/g,'');if(!x)return null;const normalized=x.replace(/\./g,'').replace(',','.');if(!/^-?\d+(?:\.\d+)?$/.test(normalized))return null;const num=Number(normalized);return Number.isFinite(num)?Math.round(num*100)/100:null;}
function brInteger(value){const raw=String(value||'').trim().replace(/\./g,'');return /^\d+$/.test(raw)?Number(raw):null;}
const cashCents=(v)=>v==null?null:Math.round(Number(v)*100);
// Compatível com borderôs CBF/FMF com e sem títulos, CNPJ e preços de gratuidade.
// Cabeçalhos e linhas de subtotal não são lançamentos financeiros.
const borderoNormalizeLine=(s)=>String(s||'').replace(/[\u00a0\u2007\u202f]/g,' ').replace(/[\t ]+/g,' ').trim();
const borderoWithoutAccents=(s)=>borderoNormalizeLine(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
function parseBorderoTickets(text){
 const linhas=[],erros=[],total={disponiveis:null,devolvidos:null,vendidos:null,receita_bruta:null};let subTotal=null;
 const amount='[\\d.]+,\\d{2}',qty='[\\d.]+';
 const ticketPattern=new RegExp(`^(.+?)\\s+(${qty})\\s+(${qty})\\s+(${qty})\\s+(-|–|—|${amount})\\s+(${amount})$`,'i');
 // O TOTAL normalmente não inclui preço. Alguns formulários usam um hífen nesse espaço.
 const summaryPattern=new RegExp(`^(?:SUB[\\s-]*TOTAL(?:\\s*\\([^)]*\\))?|TOTAL)\\s+(${qty})\\s+(${qty})\\s+(${qty})\\s+(?:(?:-|–|—)\\s+)?(${amount})$`,'i');
 for(const [i,entry] of String(text||'').split(/\r?\n/).entries()){
  const s=borderoNormalizeLine(entry),upper=borderoWithoutAccents(s);
  if(!s||upper==='INGRESSOS'||/^LOCALIZACAO(?:\s|$)/.test(upper)||/^(?:DISPONIVEL|DEVOLVIDOS|VENDIDOS|PRECO|ARRECADACAO)(?:\s|$)/.test(upper))continue;
  if(/^TOTAL(?:\s|$)/.test(upper)||/^SUB[\s-]*TOTAL(?:\s|$|\()/.test(upper)){
   const mt=s.match(summaryPattern);
   if(!mt){erros.push(`Resumo de ingressos inválido na linha ${i+1}: ${s.slice(0,75)}`);continue;}
   const obj={disponiveis:brInteger(mt[1]),devolvidos:brInteger(mt[2]),vendidos:brInteger(mt[3]),receita_bruta:moneyBR(mt[4])};
   if(/^TOTAL(?:\s|$)/.test(upper))Object.assign(total,obj);
   else subTotal=obj; // Sub-Total nunca entra novamente na soma de ingressos.
   continue;
  }
  const mt=s.match(ticketPattern);
  if(!mt){erros.push(`Ingresso não reconhecido na linha ${i+1}: ${s.slice(0,80)}`);continue;}
  const price=/^[-–—]$/.test(mt[5])?0:moneyBR(mt[5]); // Ingressos gratuitos usam preço zero; o banco exige valor numérico.
  linhas.push({localizacao:mt[1].trim(),disponiveis:brInteger(mt[2]),devolvidos:brInteger(mt[3]),vendidos:brInteger(mt[4]),preco:price,arrecadacao:moneyBR(mt[6])});
 }
 if(total.vendidos==null&&subTotal)Object.assign(total,subTotal);
 return {linhas,total,erros};
}
// ARENA_MRV_BORDERO_LINHAS_V44: reúne descrições quebradas em várias linhas.
// Mantém o índice original para informar a linha exata caso ainda exista erro.
function borderoExpenseJoinedLines(text){
 const rows=String(text||'').split(/\r?\n/);
 const valueAtEnd=/\s+[\d.]+,\d{2}$/;
 const isStructural=(line)=>{
  const s=borderoWithoutAccents(line);
  return !s||/^(?:B[123](?:\s*[-–—:].*)?$|DESPESAS$|DESCRICAO(?:\s|$)|VALOR(?:\s|$)|TOTAL(?:\s|$)|(?:RENDA|RECEITA|RESULTADO|LUCRO)\s+LIQUID[OA](?:\s|$))/.test(s);
 };
 for(let i=0;i<rows.length;i++){
  const original=borderoNormalizeLine(rows[i]);
  if(isStructural(original)||valueAtEnd.test(original))continue;
  let combined=original;
  const consumed=[];
  // Não atravessa cabeçalhos, totais ou linhas vazias.
  // Limite de 5 linhas adicionais para evitar juntar despesas independentes.
  for(let j=i+1;j<rows.length&&j<=i+5;j++){
   const continuation=borderoNormalizeLine(rows[j]);
   if(isStructural(continuation))break;
   combined+=' '+continuation;
   consumed.push(j);
   if(valueAtEnd.test(combined)){
    rows[i]=combined;
    for(const k of consumed)rows[k]='';
    break;
   }
  }
 }
 return rows;
}
// ARENA_MRV_BORDERO_NEGATIVOS_V46: aceita resultado líquido negativo e cabeçalho DESC. nas retenções.
function parseBorderoExpenses(text){
 const linhas=[],erros=[],totais={B1:null,B2:null,B3:null,despesa_total:null};let group=null,implicitIndex=0;
 for(const [i,entry] of borderoExpenseJoinedLines(text).entries()){
  const s=borderoNormalizeLine(entry),upper=borderoWithoutAccents(s);
  if(!s||upper==='DESPESAS'||/^(?:DESCRICAO|VALOR)(?:\s|$)/.test(upper))continue;
  const header=upper.match(/^B([123])(?:\s*[-–—:]\s*.*)?$/);
  if(header){group='B'+header[1];implicitIndex=Number(header[1])-1;continue;}
  // Borderôs FMF também podem trazer a renda líquida no final do mesmo
  // bloco de despesas. Ela é resultado da DRE, não lançamento de B3.
  let mt=upper.match(/^(?:RENDA|RECEITA|RESULTADO|LUCRO)\s+LIQUID[OA]\s+(?:R\$\s*)?([-−–—]?\s*[\d.]+,\d{2})$/);
  if(mt){totais.renda_liquida_informada=moneyBR(mt[1]);continue;}
  mt=s.match(/^TOTAL\s+DAS\s+DESPESAS.*?([\d.]+,\d{2})$/i);
  if(mt){totais.despesa_total=moneyBR(mt[1]);continue;}
  mt=s.match(/^TOTAL\s+([\d.]+,\d{2})$/i);
  if(mt){
   const target=group||'B'+Math.min(implicitIndex+1,3);
   totais[target]=moneyBR(mt[1]);
   if(!group)implicitIndex=Math.min(implicitIndex+1,2);
   continue;
  }
  mt=s.match(/^(.+?)\s+([\d.]+,\d{2})$/);
  if(mt){
   // Quando o arquivo não traz os títulos B1/B2/B3, os totais de cada bloco
   // permitem separar os grupos na ordem oficial B1, B2 e B3.
   const target=group||'B'+Math.min(implicitIndex+1,3);
   linhas.push({grupo:target,descricao:mt[1].trim(),valor:moneyBR(mt[2])});
   continue;
  }
  erros.push(`Despesa não reconhecida na linha ${i+1}: ${s.slice(0,80)}`);
 }
 return {linhas,totais,erros};
}
function parseBorderoDiscounts(text){
 const linhas=[],erros=[];let total=null;
 for(const [i,entry] of String(text||'').split(/\r?\n/).entries()){
  const s=borderoNormalizeLine(entry),upper=borderoWithoutAccents(s);
  if(!s||upper==='DESCONTOS'||/^(?:DESCRICAO|VALOR)(?:\s|$)/.test(upper)||/^(?:DESC\.?|DESCONTO|RETENCOES|DESP\.?)$/.test(upper))continue;
  const mt=s.match(/^(.+?)\s+([\d.]+,\d{2})$/);
  if(!mt){erros.push(`Desconto não reconhecido na linha ${i+1}: ${s.slice(0,70)}`);continue;}
  if(borderoWithoutAccents(mt[1])==='TOTAL')total=moneyBR(mt[2]);
  else linhas.push({descricao:mt[1].trim(),valor:moneyBR(mt[2])});
 }
 return {linhas,total,erros};
}
function parseBorderoDivision(text){
 const linhas=[],erros=[];
 const rx=/^(.+?)(?:\s+(\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}))?\s+(\d+(?:[.,]\d+)?)\s*%\s+([-−–—]?\s*[\d.]+,\d{2})\s+([-−–—]?\s*[\d.]+,\d{2})$/; // ARENA_MRV_BORDERO_NEGATIVO_V40
 for(const [i,entry] of String(text||'').split(/\r?\n/).entries()){
  const s=borderoNormalizeLine(entry),upper=borderoWithoutAccents(s);
  if(!s||/^DIVISAO\s+DE\s+RENDA/.test(upper)||/^CLUBES?(?:\s|$)/.test(upper)||/^(?:PERCENTUAL|DESCONTO|LIQUIDO)(?:\s|$)/.test(upper))continue;
  const mt=s.match(rx);
  if(!mt){erros.push(`Divisão de renda não reconhecida na linha ${i+1}: ${s.slice(0,85)}`);continue;}
  linhas.push({clube:mt[1].trim(),cnpj:mt[2]||null,percentual:Number(mt[3].replace(',','.')),desconto:moneyBR(mt[4]),liquido:moneyBR(mt[5])});
 }
 return {linhas,erros};
}
function parseFullBordero(textos){const ingressos=parseBorderoTickets(textos.ingressos),despesas=parseBorderoExpenses(textos.despesas),descontos=parseBorderoDiscounts(textos.descontos),divisao=parseBorderoDivision(textos.divisao);
 const original=[textos.ingressos,textos.despesas,textos.descontos,textos.divisao].some(s=>String(s||'').trim());
 const result={presente:original,textos,ingressos:ingressos.linhas,despesas:despesas.linhas,descontos:descontos.linhas,divisao:divisao.linhas,erros:[...ingressos.erros,...despesas.erros,...descontos.erros,...divisao.erros],avisos:[],totais:{}};
 if(!original)return result;
 const incomeLines=ingressos.linhas.reduce((a,x)=>a+cashCents(x.arrecadacao),0)/100;
 const soldLines=ingressos.linhas.reduce((a,x)=>a+x.vendidos,0);
 const availableLines=ingressos.linhas.reduce((a,x)=>a+x.disponiveis,0);
 const returnedLines=ingressos.linhas.reduce((a,x)=>a+x.devolvidos,0);
 const groupLines={B1:0,B2:0,B3:0};for(const x of despesas.linhas)groupLines[x.grupo]+=cashCents(x.valor);
 const groupAmounts=Object.fromEntries(['B1','B2','B3'].map(k=>[k,despesas.totais[k]??(despesas.linhas.some(x=>x.grupo===k)?groupLines[k]/100:null)]));
 const groupSum=Object.values(groupAmounts).filter(x=>x!=null).reduce((a,x)=>a+cashCents(x),0)/100;
 const expenseOfficial=despesas.totais.despesa_total??(['B1','B2','B3'].every(k=>groupAmounts[k]!=null)?groupSum:null);
 const discountLines=descontos.linhas.reduce((a,x)=>a+cashCents(x.valor),0)/100;
 const gross=ingressos.total.receita_bruta??(ingressos.linhas.length?incomeLines:null);
 const galo=divisao.linhas.find(x=>/atl[eé]tico\s+mineiro/i.test(x.clube)||/atl[eé]tico\s*[-–]/i.test(x.clube));
 result.totais={disponiveis:ingressos.total.disponiveis??(ingressos.linhas.length?availableLines:null),devolvidos:ingressos.total.devolvidos??(ingressos.linhas.length?returnedLines:null),vendidos:ingressos.total.vendidos??(ingressos.linhas.length?soldLines:null),receita_bruta:gross,despesa_total:expenseOfficial,descontos_total:descontos.total??(descontos.linhas.length?discountLines:null),liquido_galo:galo?.liquido??null,B1:groupAmounts.B1,B2:groupAmounts.B2,B3:groupAmounts.B3};
 const warn=(name,declared,computed,scale=100)=>{if(declared!=null&&Math.abs(Math.round(declared*scale)-Math.round(computed*scale))>0)result.avisos.push(`Conferência de ${name}: total informado ${scale===1?fmt(declared):money(declared)} versus soma das linhas ${scale===1?fmt(computed):money(computed)}.`);};
 warn('arrecadação',ingressos.total.receita_bruta,incomeLines);warn('ingressos vendidos',ingressos.total.vendidos,soldLines,1);
 for(const k of ['B1','B2','B3'])if(despesas.totais[k]!=null)warn('despesas '+k,despesas.totais[k],groupLines[k]/100);
 if(expenseOfficial!=null&&Object.values(groupAmounts).every(v=>v!=null))warn('despesa total versus B1+B2+B3',expenseOfficial,groupSum);
 warn('descontos',descontos.total,discountLines);
 // Quando o Borderô informa o próprio resultado após B3, validar sem somá-lo.
 if(gross!=null&&expenseOfficial!=null&&despesas.totais.renda_liquida_informada!=null)
  warn('renda líquida informada versus renda menos despesas',despesas.totais.renda_liquida_informada,gross-expenseOfficial);
 if(gross!=null&&expenseOfficial!=null&&galo?.liquido!=null)warn('líquido do Galo versus renda menos despesas',galo.liquido,gross-expenseOfficial);
 return result;
}
// Dados avulsos de borderô: úteis quando a competição não fornece o boletim financeiro.
// São persistidos nas colunas já existentes jogos.publico_pagante e jogos.renda.
function parseManualAttendance(raw){
 const value=String(raw??'').trim();
 if(!value)return {value:null,error:null};
 if(!/^(?:\d+|\d{1,3}(?:\.\d{3})+)$/.test(value))return {value:null,error:'Público pagante inválido. Use 29.782 (somente pessoas, sem casas decimais).'};
 const number=Number(value.replace(/\./g,''));
 if(!Number.isSafeInteger(number)||number<0||number>1000000)return {value:null,error:'Público pagante fora do intervalo permitido.'};
 return {value:number,error:null};
}
function parseManualRevenue(raw){
 const value=String(raw??'').trim();
 if(!value)return {value:null,error:null};
 const numberText=value.replace(/^R\$\s*/i,'').replace(/\s/g,'');
 let number=null;
 // Valor numérico retornado pelo Postgres: 1962077.75.
 if(/^\d+\.\d{1,2}$/.test(numberText))number=Number(numberText);
 // Valores apresentados em português: 1.962.077,75 ou 1962077,75.
 else if(/^(?:\d+|\d{1,3}(?:\.\d{3})+)(?:,\d{1,2})?$/.test(numberText))number=Number(numberText.replace(/\./g,'').replace(',','.'));
 if(!Number.isFinite(number)||number<0||number>1000000000000)return {value:null,error:'Renda inválida. Use R$ 1.962.077,75.'};
 return {value:Math.round(number*100)/100,error:null};
}
function formatManualAttendance(value){const parsed=parseManualAttendance(value);return parsed.error?String(value??''):parsed.value===null?'':new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0}).format(parsed.value);}
function formatManualRevenue(value){
 const raw=String(value??'').trim();if(!raw)return '';
 // Ao digitar parte de um número, não inserir centavos antes de terminar.
 // Ex.: digitar "2.117." não transforma em "R$ 2.117,00".
 const cleaned=raw.replace(/^R\$\s*/i,'').replace(/[\s\u00a0\u202f]/g,'');
 if(cleaned.includes(',')&&!/,\d{2}$/.test(cleaned))return raw;
 if(!cleaned.includes(',')&&raw.startsWith('R$')&&!/^\d+\.\d{1,2}$/.test(cleaned))return raw;
 if(!cleaned.includes(',')&&/\.$/.test(cleaned))return raw;
 const parsed=parseManualRevenue(raw);
 return parsed.error?raw:parsed.value===null?'':new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(parsed.value).replace(/[\u00a0\u202f]/g,' ');
}

// Não expõe credenciais administrativas nem altera o banco de dados.
const ARENA_V48_FIELDS = Object.freeze({
 jogadores:'id,pessoa_id,nome_guerra,nome_completo,posicao',
 adversarios:'id,nome',
 atuacoes:'jogo_id,jogador_id,gols,assistencias,amarelos,vermelhos',

 jogo_estatisticas_individuais:'jogo_id,jogador_id,participou,titular,posse_bola,xg,grandes_chances,grandes_chances_convertidas,finalizacoes,finalizacoes_certas,finalizacoes_trave,finalizacoes_dentro_area,defesas_goleiro,passes,passes_certos,faltas_cometidas,escanteios,desarmes,amarelos,vermelhos,toques_bola,rating,assistencias,assistencias_esperadas',

 jogo_borderos:'jogo_id,ingressos_disponiveis,ingressos_devolvidos,ingressos_vendidos,receita_bruta,despesa_total,descontos_total,liquido_galo',
 bordero_despesas:'jogo_id,grupo,descricao,valor',
 bordero_descontos:'jogo_id,descricao,valor',

});
const arenaV48Errors = new Map();
async function arenaV48Read(table,size=700){
 const columns=ARENA_V48_FIELDS[table];
 if(!columns)throw new Error('Tabela não configurada: '+table);
 let rows=[];
 for(let start=0;start<30000;start+=size){
  let part=null,problem=null;
  for(let attempt=0;attempt<2;attempt++){
   try{
    part=await readPage(table,`select=${columns}&limit=${size}&offset=${start}`);
    break;
   }catch(error){problem=error;
    if(error?.kind==='schema'||error?.kind==='permission'||error?.kind==='query')break;
   }
  }
  if(part===null)throw new Error(`${table}: ${problem?.message||'consulta indisponível'}`);
  if(!Array.isArray(part))throw new Error(`${table}: retorno inesperado`);
  rows.push(...part);
  if(part.length<size)return rows;
 }
 throw new Error(`${table}: mais de 30.000 registros; atualize o limite da consulta`);
}
async function arenaV48Table(table,size=700){
 try{const data=await arenaV48Read(table,size);arenaV48Errors.delete(table);return data;}
 catch(e){arenaV48Errors.set(table,String(e.message));console.warn('Arena MRV · '+table, e.message);return null;}
}

function arenaV48ApplyReference(games,results){
 const [players,opponents,appearances,collectiveStats,individualStats,cards]=results;
 const gamesById=new Map(games.map(m=>[String(m.id),m]));
 const playerById=new Map((players||[]).map(p=>[String(p.id),p]));
 const oppById=new Map((opponents||[]).map(o=>[String(o.id),o]));
 if(players){athletePersonById=new Map(players.map(p=>[String(p.id),String(p.pessoa_id||p.id)]));}
 if(appearances)athleteParticipationRows=appearances;
 if(collectiveStats){
  for(const game of games)game.extraTeamStats={};
  for(const row of collectiveStats){const game=gamesById.get(String(row.jogo_id));if(game)game.extraTeamStats[row.equipe]=row;}
 }
 if(individualStats){
  publicDetailedPlayerStats=individualStats.map(row=>{
   const p=playerById.get(String(row.jogador_id))||{};
   return {...row,ativo:row.participou===true||row.rating!==null&&row.rating!==undefined||Number(row.toques_bola)>0,
    posicao:p.posicao||'',pessoa_id:p.pessoa_id||row.jogador_id,nome_guerra:p.nome_guerra||'',nome_completo:p.nome_completo||'',foto:photoById.get(String(row.jogador_id))||''};
  });
 }
 if(opponents){for(const m of games){const o=oppById.get(String(m.opponentId));if(o)m.opponent=o.nome;}}
 // Não zera os dados públicos existentes se uma fonte falhar.
 if(appearances){for(const m of games){m.goals=[];m.yellowCards=[];m.redCards=[];}}
 if(appearances){for(const a of appearances){
  const m=gamesById.get(String(a.jogo_id)),p=playerById.get(String(a.jogador_id));
  if(!m||!p)continue;
  const base={id:p.pessoa_id||p.id,name:p.nome_guerra||p.nome_completo||'Atleta',position:p.posicao||'Não informado',count:0};
  if(Number(a.gols)>0)m.goals.push({...base,count:Number(a.gols)});
  if(Number(a.amarelos)>0)m.yellowCards.push({...base,count:Number(a.amarelos)});
  if(Number(a.vermelhos)>0)m.redCards.push({...base,count:Number(a.vermelhos)});
 }}
 // Considera assistências já gravadas na coluna numérica. Não transporta 3,5 MB de JSON bruto.
 if(appearances||individualStats){
  const assists=new Map();
  for(const a of appearances||[]){if(a.assistencias!=null)assists.set(`${a.jogo_id}:${a.jogador_id}`,{row:a,value:Number(a.assistencias)||0});}
  for(const s of individualStats||[]){if(s.assistencias!=null)assists.set(`${s.jogo_id}:${s.jogador_id}`,{row:s,value:Number(s.assistencias)||0});}
  for(const m of games)m.assists=[];
  for(const [key,item] of assists){const [gameId,playerId]=key.split(':');
   const m=gamesById.get(gameId),p=playerById.get(playerId);
   if(!m||!p||item.value<=0)continue;
   m.assists.push({id:p.pessoa_id||p.id,name:p.nome_guerra||p.nome_completo||'Atleta',position:p.posicao||'Não informado',count:item.value});
  }
 }
 if(cards){
  const counters=new Map();
  for(const r of cards){const key=String(r.jogo_id);let c=counters.get(key);
   if(!c){c={Galo:{Amarelo:0,Vermelho:0},Adversario:{Amarelo:0,Vermelho:0}};counters.set(key,c);}
   if(c[r.equipe]&&['Amarelo','Vermelho'].includes(r.tipo))c[r.equipe][r.tipo]++;
  }
  for(const m of games){const c=counters.get(String(m.id))||{Galo:{Amarelo:0,Vermelho:0},Adversario:{Amarelo:0,Vermelho:0}};
   m.yellowTotal=c.Galo.Amarelo;m.redTotal=c.Galo.Vermelho;
   m.opponentYellow=c.Adversario.Amarelo;m.opponentRed=c.Adversario.Vermelho;
  }
 }
}
hydrateReference = async function(games){
 const tables=['jogadores','adversarios','atuacoes','jogo_estatisticas_coletivas','jogo_estatisticas_individuais','jogo_cartoes'];
 // Consultas enxutas; sem fotos ou JSON bruto. Erros isolados não derrubam outras tabelas.
 const result=await Promise.all(tables.map(name=>arenaV48Table(name, name==='atuacoes'?600:700)));
 arenaV48ApplyReference(games,result);

};
hydrateBorderos = async function(games){
 const tables=['jogo_borderos','bordero_despesas','bordero_descontos','bordero_ingressos','bordero_divisao'];
 const results=await Promise.all(tables.map(name=>arenaV48Table(name, name==='bordero_ingressos'?600:700)));
 const [borderos,expenses,discounts,tickets,divisions]=results;
 if(!borderos)return;
 const byId=new Map(borderos.map(x=>[String(x.jogo_id),{...x,grupos:{B1:0,B2:0,B3:0},despesas:[],descontos:[],ingressos:[],divisao:[]}]));
 const details=[[expenses,'despesas'],[discounts,'descontos'],[tickets,'ingressos'],[divisions,'divisao']];
 for(const [records,field] of details){if(!records)continue;for(const item of records){const b=byId.get(String(item.jogo_id));if(!b)continue;
  b[field].push(item);
  if(field==='despesas'&&Object.hasOwn(b.grupos,item.grupo))b.grupos[item.grupo]+=Number(item.valor)||0;
 }}
 for(const m of games)m.bordero=byId.get(String(m.id))||null;
 if(!isAdminView())render();
};

// Evita as duas contas erradas no DRE: somar receita de jogos sem despesas e
// exigir 100% de cobertura antes de mostrar resultado de qualquer jogo.
finance = function(games){
 const all=(games||[]).map(game=>{
  const b=game.bordero;
  if(b){const revenue=n(b.receita_bruta)??game.revenue,expense=n(b.despesa_total);
   return {revenue,expense,b1:n(b.grupos?.B1),b2:n(b.grupos?.B2),b3:n(b.grupos?.B3),discounts:n(b.descontos_total),net:n(b.liquido_galo),has:revenue!=null&&expense!=null};}
  const raw=game.expenses,expense=raw&&Object.values(raw).every(v=>v!==null)?sum(Object.values(raw),v=>v):null;
  return {revenue:game.revenue,expense,b1:raw?.other??null,b2:raw?.taxes??null,b3:raw?.operations??null,discounts:null,net:null,has:game.revenue!=null&&expense!=null};
 });

function arenaV49SortKey(th){

function arenaV49SortValue(cell){
 if(!cell)return {type:'null',value:null};
 const raw=String(cell.getAttribute('data-sort-value')??cell.textContent??'').trim().replace(/\s+/g,' ');
 if(!raw||/^[-–—]+$/.test(raw))return {type:'null',value:null};
 const date=raw.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
 if(date)return {type:'number',value:Number(date[3]+date[2]+date[1])};
 const dateISO=raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
 if(dateISO)return {type:'number',value:Number(dateISO[1]+dateISO[2]+dateISO[3])};
 let amount=raw.replace(/^(?:R\$|#)\s*/i,'').replace(/\s*(?:%|jogo\(s\)|jogos|gol\(s\)|gols|min(?:utos)?)$/i,'').trim();
 if(/^[-+]?\d[\d.,\s]*$/.test(amount)){
  amount=amount.replace(/\s/g,'');
  if(amount.includes(',')&&amount.includes('.'))amount=amount.lastIndexOf(',')>amount.lastIndexOf('.')?amount.replace(/\./g,'').replace(',','.'):amount.replace(/,/g,'');
  else if(amount.includes(','))amount=amount.replace(',','.');
  else if(/^[-+]?\d{1,3}(?:\.\d{3})+$/.test(amount))amount=amount.replace(/\./g,'');
  const v=Number(amount);if(Number.isFinite(v))return {type:'number',value:v};
 }
 return {type:'text',value:raw};
}
function arenaV49SortTable(table,column,direction,key){
 const body=table.tBodies[0];if(!body)return;
 const rows=[...body.rows];if(rows.length<2||rows.some(row=>row.cells.length!==table.tHead.rows[0].cells.length))return;
 const records=rows.map((row,index)=>({row,index,data:arenaV49SortValue(row.cells[column])}));
 records.sort((a,b)=>{
  if(a.data.value==null)return b.data.value==null?a.index-b.index:1;
  if(b.data.value==null)return -1;
  const comp=a.data.type==='number'&&b.data.type==='number'?a.data.value-b.data.value:
   String(a.data.value).localeCompare(String(b.data.value),'pt-BR',{numeric:true,sensitivity:'base'});
  return (direction==='asc'?comp:-comp)||a.index-b.index;
 });
 const fragment=document.createDocumentFragment();records.forEach(({row})=>fragment.append(row));body.append(fragment);
 table.querySelectorAll('thead th').forEach((th,i)=>th.setAttribute('aria-sort',i===column?(direction==='asc'?'ascending':'descending'):'none'));

}

  headings.forEach(th=>{th.classList.add('arena-v49-sortable');th.setAttribute('tabindex','0');th.setAttribute('role','button');th.title='Clique para ordenar crescente ou decrescente';});

 });
}

function arenaV50Date(iso){
 const match=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
 if(!match)return null;
 const d=new Date(Date.UTC(+match[1],+match[2]-1,+match[3]));
 return d.getUTCFullYear()===+match[1]&&d.getUTCMonth()===+match[2]-1&&d.getUTCDate()===+match[3]?d:null;
}
function arenaV50Age(birth,gameDate){
 const start=arenaV50Date(birth),end=arenaV50Date(gameDate);
 if(!start||!end||end<=start)return null;
 let years=end.getUTCFullYear()-start.getUTCFullYear();
 let months=end.getUTCMonth()-start.getUTCMonth();
 let days=end.getUTCDate()-start.getUTCDate();
 if(days<0){months--;days+=new Date(Date.UTC(end.getUTCFullYear(),end.getUTCMonth(),0)).getUTCDate();}
 if(months<0){years--;months+=12;}
 if(years<0||years>115)return null;
 const delta=(end.getTime()-start.getTime())/86400000;
 return {years,months,days,delta,asYears:delta/365.2425};
}

  ['players','jogadores','id,pessoa_id,nome_guerra,nome_completo,posicao,temporada,data_nascimento'],
  ['refs','arbitragem','id,tipo,nome,data_nascimento'],

  ['goals','jogo_gols','id,jogo_id,equipe,jogador_id,gol_contra']

 const res=await Promise.allSettled(sources.map(async([key,table,columns])=>({key,data:await arenaV49ReadRows(table,columns,500)})));
 res.forEach((r,i)=>{
  const source=sources[i][0];
  if(r.status==='rejected'){arenaV50.errors.set(source,String(r.reason?.message||r.reason));return;}
  arenaV50.errors.delete(source);const rows=r.value.data;

}

 <div class="stats-summary-grid-v14">${arenaV50RefAgePanel('Árbitros mais velhos',refs,true)}${arenaV50RefAgePanel('Árbitros mais novos',refs,false)}</div></div>`;
}
const arenaV50OldScopeButtons=statsScopeButtonsV14;
statsScopeButtonsV14=function(){
 let html=arenaV50OldScopeButtons();
 html=html.replace('</div>',`<button type="button" role="tab" aria-selected="${state.statsScope==='arbitragem'}" class="stats-main-tab ${state.statsScope==='arbitragem'?'active':''}" data-stats-scope="arbitragem"><span>Arbitragem</span><small>Faltas, cartões e árbitros</small></button></div>`);
 return html;
};
const arenaV50OriginalStats=renderStats;
renderStats=function(){return state.statsScope==='arbitragem'?arenaV50RefView(currentMatches()):arenaV50OriginalStats();};
function arenaV50CoachRows(games){
 const groups=new Map();
 for(const g of games){
  const m=arenaV50.meta.get(String(g.id)),p=arenaV50FindPerson(m?.tecnico_id),name=p?.nome_guerra||g.coach||'Não informado';
  if(name==='Não informado')continue;
  const key=norm(name);if(!groups.has(key))groups.set(key,{name,birth:p?.data_nascimento||null,ids:new Set(),games:[]});
  const info=groups.get(key);if(!info.birth&&p?.data_nascimento)info.birth=p.data_nascimento;
  if(!info.ids.has(String(g.id))){info.ids.add(String(g.id));info.games.push(g);}
 }
 return [...groups.values()].map(item=>{
  const games=item.games,latest=games.reduce((a,g)=>!a||g.date>a?g.date:a,null);
  const keys=[['posse_bola','Galo'],['xg','Galo'],['finalizacoes','Galo'],['finalizacoes_certas','Galo'],['finalizacoes_dentro_area','Galo'],['passes','Galo'],['passes_certos','Galo'],['finalizacoes','Adversario'],['xg','Adversario']];
  const values=keys.map(([metric,side])=>{
   const v=games.map(g=>statsSideValueV14(g,side,metric)).filter(statsHasV14);
   return {value:arenaV50Mean(v),covered:v.length};
  });
  return {...item,count:games.length,age:arenaV50Age(item.birth,latest),latest,values};
 });
}
function arenaV50CoachAnalysis(games){
 const coaches=arenaV50CoachRows(games).sort((a,b)=>b.count-a.count);
 const headers=['Posse (%)','xG','Finalizações','No alvo','Dentro da área','Passes','Passes certos','Finalizações sofridas','xG adversário'];
 const comp=panel('Comparativo técnico · médias por partida',`<div class="table-wrap"><table><thead><tr><th>Técnico</th><th>Jogos</th>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${coaches.map(p=>`<tr><td>${esc(p.name)}</td><td>${fmt(p.count)}</td>${p.values.map((v,i)=>`<td title="${v.covered} jogo(s) com estatística">${arenaV50Fmt(v.value,i===1||i===8?2:1)} <small>(${v.covered})</small></td>`).join('')}</tr>`).join('')||'<tr><td colspan="11">Sem técnicos cadastrados.</td></tr>'}</tbody></table></div>`,'Média por jogo apenas quando o indicador está disponível. Número entre parênteses = jogos com dados.');
 const sort=older=>coaches.filter(p=>p.age).sort((a,b)=>(older?b.age.delta-a.age.delta:a.age.delta-b.age.delta)).slice(0,10);
 const agePanel=(title,older)=>panel(title,`<div class="table-wrap"><table><thead><tr><th>Técnico</th><th>Idade na última partida</th><th>Jogos</th></tr></thead><tbody>${sort(older).map(p=>`<tr><td>${esc(p.name)}</td><td data-sort-value="${p.age.delta}">${arenaV50AgeText(p.age)}</td><td>${fmt(p.count)}</td></tr>`).join('')||'<tr><td colspan="3">Sem datas de nascimento.</td></tr>'}</tbody></table></div>`,'Idade calculada na última partida no período selecionado');
 return `<div class="stats-section-title-v14"><h2>Análise de desempenho dos técnicos</h2><p>Indicadores do Atlético na Arena MRV, respeitando temporada e campeonato. Finalizações sofridas e xG adversário usam os números do rival.</p></div>${arenaV50Loading()}${comp}<div class="stats-summary-grid-v14">${agePanel('Técnicos mais velhos',true)}${agePanel('Técnicos mais novos',false)}</div>`;
}
const arenaV50OldCoaches=renderCoaches;
renderCoaches=function(){const games=currentMatches();return arenaV50OldCoaches()+arenaV50CoachAnalysis(games);};
document.addEventListener('change',event=>{
 const element=event.target;
 if(element.matches?.('[data-arena-v50-age-mode]')){arenaV50.ageMode=element.value==='todos'?'todos':'titulares';render();}
 if(element.matches?.('[data-arena-v50-ref-sort]')){arenaV50.refOrder=arenaV50RefSorts.some(([x])=>x===element.value)?element.value:'games';render();}
},true);
document.addEventListener('click',event=>{if(!event.target.closest?.('[data-arena-v50-retry]'))return;event.preventDefault();void arenaV50Load();},true);
const arenaV50Style=document.createElement('style');
arenaV50Style.textContent='.arena-v50-filter{display:inline-flex;align-items:center;gap:12px;margin:12px 0 20px;color:#444b50;font-size:13px}.arena-v50-filter select{min-width:210px;border:1px solid #d8dce1;border-radius:8px;background:white;padding:8px}.stats-summary-grid-v14 .panel{min-width:0}.stats-summary-grid-v14 table td{white-space:normal}.stats-summary-grid-v14 table{font-size:12px}';
document.head.appendChild(arenaV50Style);

// Os indicadores iniciam vazios; dados fictícios só com ação explícita.
matches=[];state.page=pathPage();if(state.page==='cadastro')syncCadastroRoute({canonical:true});ensureSeason();render();loadLive();if(publicDetailGameId)loadPublicGameDetail(publicDetailGameId);
</script>
